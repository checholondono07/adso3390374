<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45-Challenge Grid</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #6b35a0;
            font-family: Arial;
        }

        h1 {
            text-align: center;
            color: white;
            margin: 10px 0 5px;
        }

        h4 {
            text-align: center;
            color: #ddd;
            margin: 0 0 20px;
            font-weight: normal;
        }

        .wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 260px 260px 260px;
            grid-gap: 10px;
            width: 95%;
            max-width: 950px;
            margin: 0 auto;
            padding: 10px;
            background: rgba(0, 0, 0, 0.35);
            box-sizing: border-box;
        }

        .wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 4px solid white;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .wrapper * {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .img2 {
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 3;
        }

        .img6 {
            grid-column-start: 1;
            grid-column-end: 3;
        }

        .wrapper2 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows: 190px 190px 190px;
            grid-gap: 10px;
            width: 95%;
            max-width: 950px;
            margin: 30px auto 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.35);
            box-sizing: border-box;
        }

        .wrapper2 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 4px solid white;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .wrapper2 * {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .foto1 {
            grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 3;
        }

        .foto4 {
            grid-column-start: 3;
            grid-column-end: 5;
            grid-row-start: 2;
            grid-row-end: 4;
        }

        .foto5 {
            grid-column-start: 1;
            grid-row-start: 3;
        }

        .foto6 {
            grid-column-start: 2;
            grid-row-start: 3;
        }
    </style>
</head>

<body>

    <h1>45-Challenge Grid</h1>
    <h4>Una colección de imágenes organizadas utilizando CSS Grid</h4>

    <div class="wrapper">

        <img src="imgs/1.jpg">

        <img class="img2" src="imgs/2.jpg">

        <img src="imgs/3.jpg">

        <img src="imgs/4.jpg">

        <img src="imgs/5.jpg">

        <img class="img6" src="imgs/6.jpg">

        <img src="imgs/7.jpg">

    </div>

    <div class="wrapper2">

        <img class="foto1" src="imgs/1.jpg">

        <img src="imgs/8.jpg">

        <img src="imgs/9.jpg">

        <img class="foto4" src="imgs/10.jpg">

        <img class="foto5" src="imgs/6.jpg">

        <img class="foto6" src="imgs/7.jpg">

    </div>

</body>
</html>
